[package]
name = "sm-display-tuner"
version = "0.1.0"
edition = "2021"
description = "Ajuste ao vivo da curva de cor da GPU (estilo BetterDisplay) com exportação para ICC — SM Acoustics"
license = "MIT"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
